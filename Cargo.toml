[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
version = "0.2.2"
license = "GPL-3.0-or-later"
repository = "https://github.com/maxib0n/NiceDB"
homepage = "https://github.com/maxib0n/NiceDB"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled", "column_decltype", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
specta = { version = "2.0.0-rc", features = ["derive"] }
specta-typescript = "0.0"
tauri-specta = { version = "2.0.0-rc.26", features = ["derive", "typescript"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
tokio-util = "0.7"
async-trait = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
rsfbclient-rust = { path = "vendor/rsfbclient-rust" }
