name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: input
    id: engine
    attributes:
      label: Engine and version
      description: For example PostgreSQL 16.4, SQL Server 2022 CU14, MongoDB 7.0 (Atlas).
    validations:
      required: true
  - type: input
    id: nicedb
    attributes:
      label: NiceDB version and system
      description: Settings › About shows the version. For example 0.3.0 on Windows 11.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps, and the SQL or the table involved if you can share it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The error message as shown, or a screenshot.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: A small schema and data, or a docker image, that shows the problem. Remove anything private.
